<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ticketrise — piletid • üritused</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Ticketrise avaleht">
      <span class="logo" aria-hidden="true">T</span>
      <span class="brandText">
        <strong>Ticketrise</strong>
        <small>piletid • üritused</small>
      </span>
    </a>

    <nav class="nav">
      <a href="#home" class="navLink" data-nav="home">Avaleht</a>
      <a href="#events" class="navLink" data-nav="events">Üritused</a>
      <a href="#organizer" class="navLink navOrganizer" data-nav="organizer" hidden>Korraldaja</a>
    </nav>

    <div class="actions">
      <!-- Ainult 1 nupp -->
      <button class="btn ghost" id="btnAuth">Logi sisse</button>
      <button class="btn ghost" id="btnLogout" hidden>Logi välja</button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- AUTH MODAL (üks vaade korraga) -->
  <div class="modal" id="modalAuth" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modalTop">
        <h3 id="authTitle">Logi sisse</h3>
        <button class="iconBtn" id="authClose" aria-label="Sulge">✕</button>
      </div>

      <form id="formLogin" class="form">
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Parool</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn full" type="submit">Logi sisse</button>

        <p class="hint">
          Demo korraldaja: <b>demo@ticketrise.ee</b> / <b>Ticketrise123!</b><br/>
          Demo ostja: <b>buyer@ticketrise.ee</b> / <b>Ticketrise123!</b>
        </p>

        <p class="hint">
          Pole kontot? <button type="button" class="linkBtn" id="toSignup">Loo konto</button>
        </p>
      </form>

      <form id="formSignup" class="form" hidden>
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Parool</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label class="field">
          <span>Korda parool</span>
          <input type="password" name="password2" autocomplete="new-password" minlength="8" required />
        </label>
        <button class="btn full" type="submit">Loo konto</button>

        <p class="hint">
          Konto olemas? <button type="button" class="linkBtn" id="toLogin">Logi sisse</button>
        </p>
      </form>

      <div class="toast" id="authToast" hidden></div>
    </div>
  </div>

  <!-- EVENT DETAIL MODAL (et “kastile vajutades avaneb”) -->
  <div class="modal" id="modalEvent" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
      <div class="modalTop">
        <h3 id="eventTitle">Üritus</h3>
        <button class="iconBtn" id="eventClose" aria-label="Sulge">✕</button>
      </div>

      <div id="eventBody"></div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
