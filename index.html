<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ticketrise</title>

  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- =========================
    TOPBAR (Ticketrise)
  ========================= -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#home" aria-label="Ticketrise avaleht">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="32" height="32">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c3aed"/>
                <stop offset="0.5" stop-color="#22d3ee"/>
                <stop offset="1" stop-color="#f97316"/>
              </linearGradient>
            </defs>
            <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#g)"/>
            <path d="M22 22h20v8H22zM22 34h14v8H22z" fill="#06101a" opacity="0.92"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Ticketrise</span>
          <span class="brand-sub">piletid • üritused • check-in</span>
        </span>
      </a>

      <nav class="nav">
        <a href="#home">Avaleht</a>
        <a href="#browse">Üritused</a>
      </nav>

      <div class="actions">
        <button class="btn btn-ghost" id="btnAuth">Logi sisse</button>
        <button class="btn btn-primary hidden" id="btnDashboard">Korraldaja</button>
        <button class="btn btn-danger hidden" id="btnLogout">Logi välja</button>
      </div>
    </div>
  </header>

  <!-- =========================
    HOME
  ========================= -->
  <main class="wrap" style="padding:26px 16px 60px">
    <div class="hero-badge">⚡ Night-ready piletiplatvorm</div>
    <h1 class="hero-title">Leia elamus, mis <span class="glow">päriselt</span> loeb.</h1>
    <p class="hero-sub">Otsi üritusi, vali pilet, maksa ja saa QR-pilet e-mailile.</p>

    <div class="searchCard" style="margin-top:16px">
      <div class="searchRow">
        <div class="searchField">
          <label>Otsi</label>
          <input id="q" placeholder="Üritus, korraldaja, koht…" />
        </div>

        <div class="searchField">
          <label>Asukoht</label>
          <select id="city">
            <option value="">Vali linn</option>
            <option value="all">Kõik linnad</option>
            <option value="tallinn">Tallinn</option>
            <option value="tartu">Tartu</option>
            <option value="parnu">Pärnu</option>
            <option value="narva">Narva</option>
          </select>
        </div>

        <button class="btn btn-primary btn-search" id="doSearch">Otsi</button>
      </div>
    </div>

    <div class="sectionHead" style="margin-top:18px">
      <h2>Üritused</h2>
      <div class="muted" id="countText"></div>
    </div>

    <div class="grid" id="eventGrid"></div>
  </main>

  <!-- =========================
    AUTH MODAL (login/register)
  ========================= -->
  <div class="modalBack hidden" id="authBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Autentimine">
      <div class="modalHead">
        <div class="modalTabs">
          <button class="tab active" id="tabLogin">Logi sisse</button>
          <button class="tab" id="tabRegister">Loo konto</button>
        </div>
        <button class="btn btn-ghost" id="authClose">Sulge</button>
      </div>

      <div class="modalBody">
        <div id="loginView">
          <div class="row2">
            <div class="field">
              <label>Email</label>
              <input id="loginEmail" placeholder="email@domain.ee">
            </div>
            <div class="field">
              <label>Parool</label>
              <input id="loginPass" type="password" placeholder="••••••">
            </div>
          </div>

          <div class="field">
            <label>Kes sa oled?</label>
            <select id="loginRole">
              <option value="buyer">Ostja</option>
              <option value="organizer">Korraldaja</option>
            </select>
          </div>

          <button class="btn btn-primary w100" id="doLogin">Logi sisse</button>
        </div>

        <div id="registerView" class="hidden">
          <div class="row2">
            <div class="field">
              <label>Email</label>
              <input id="regEmail" placeholder="email@domain.ee">
            </div>
            <div class="field">
              <label>Parool</label>
              <input id="regPass" type="password" placeholder="vali parool">
            </div>
          </div>

          <div class="field">
            <label>Konto tüüp</label>
            <select id="regRole">
              <option value="buyer">Ostja</option>
              <option value="organizer">Korraldaja</option>
            </select>
          </div>

          <button class="btn btn-primary w100" id="doRegister">Loo konto</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
