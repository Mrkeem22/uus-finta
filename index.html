<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticketrise</title>

  <!-- CSS (OLULINE: relatiivne tee) -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<!-- =========================
  TOPBAR
========================= -->
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <div class="logo">
        <!-- Simple logo -->
        <svg viewBox="0 0 64 64" width="28" height="28">
          <defs>
            <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c3aed"/>
              <stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#tg)"/>
          <path d="M22 22h20v8H22zM22 34h14v8H22z" fill="#020617"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Ticketrise</div>
        <div class="brand-sub">piletid • üritused</div>
      </div>
    </div>

    <nav class="nav">
      <a href="#home">Avaleht</a>
      <a href="#events">Üritused</a>
    </nav>

    <div class="actions">
      <button class="btn btn-ghost" id="btnAuth">Logi sisse</button>
      <button class="btn btn-primary hidden" id="btnDashboard">Korraldaja</button>
      <button class="btn btn-danger hidden" id="btnLogout">Logi välja</button>
    </div>
  </div>
</header>

<!-- =========================
  HOME
========================= -->
<main class="wrap page active" id="pageHome">

  <div class="hero">
    <div class="hero-badge">⚡ Night-ready piletiplatvorm</div>
    <h1 class="hero-title">
      Leia elamus, mis <span class="glow">päriselt</span> loeb
    </h1>
    <p class="hero-sub">
      Otsi üritusi, vali pilet ja saa QR-pilet e-mailile.
    </p>
  </div>

  <!-- SEARCH -->
  <div class="searchCard">
    <div class="searchRow">
      <div class="searchField">
        <label>Otsi</label>
        <input id="q" placeholder="Üritus, korraldaja, koht…" />
      </div>

      <div class="searchField">
        <label>Asukoht</label>
        <select id="city">
          <option value="">Vali linn</option>
          <option value="tallinn">Tallinn</option>
          <option value="tartu">Tartu</option>
          <option value="parnu">Pärnu</option>
          <option value="narva">Narva</option>
          <option value="all">Kõik linnad</option>
        </select>
      </div>

      <button class="btn btn-primary btn-search" id="doSearch">
        Otsi
      </button>
    </div>
  </div>

  <!-- EVENTS -->
  <div class="sectionHead">
    <h2>Üritused</h2>
    <div class="muted" id="countText"></div>
  </div>

  <div class="grid" id="eventGrid">
    <!-- app.js renderdab siia üritused -->
  </div>

</main>

<!-- =========================
  AUTH MODAL
========================= -->
<div class="modalBack hidden" id="authBack">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTabs">
        <button class="tab active" id="tabLogin">Logi sisse</button>
        <button class="tab" id="tabRegister">Loo konto</button>
      </div>
      <button class="btn btn-ghost" id="authClose">Sulge</button>
    </div>

    <div class="modalBody">
      <!-- LOGIN -->
      <div id="loginView">
        <div class="field">
          <label>E-mail</label>
          <input id="loginEmail" placeholder="email@domain.ee">
        </div>

        <div class="field">
          <label>Parool</label>
          <input id="loginPass" type="password">
        </div>

        <div class="field">
          <label>Roll</label>
          <select id="loginRole">
            <option value="buyer">Ostja</option>
            <option value="organizer">Korraldaja</option>
          </select>
        </div>

        <button class="btn btn-primary w100" id="doLogin">
          Logi sisse
        </button>
      </div>

      <!-- REGISTER -->
      <div id="registerView" class="hidden">
        <div class="field">
          <label>E-mail</label>
          <input id="regEmail">
        </div>

        <div class="field">
          <label>Parool</label>
          <input id="regPass" type="password">
        </div>

        <div class="field">
          <label>Konto tüüp</label>
          <select id="regRole">
            <option value="buyer">Ostja</option>
            <option value="organizer">Korraldaja</option>
          </select>
        </div>

        <button class="btn btn-primary w100" id="doRegister">
          Loo konto
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<!-- JS (OLULINE: relatiivne tee) -->
<script src="./app.js"></script>

</body>
</html>
