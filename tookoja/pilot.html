</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
const U='https://c--736888bc-bbe3-43ab-b2e7-b154a7e0cea5-prod.lovable.cloud',K='sb_publishable_QMnrM1saUHgwYPpGGNx4AQ_seQVyhyh',S='tk_session';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),eur=n=>new Intl.NumberFormat('et-EE',{style:'currency',currency:'EUR'}).format(+n||0),date=s=>s?new Intl.DateTimeFormat('et-EE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(s)):'—',time=s=>s?new Intl.DateTimeFormat('et-EE',{hour:'2-digit',minute:'2-digit'}).format(new Date(s)):'—';let st={user:null,org:null,member:null,view:'today',customers:[],vehicles:[],jobs:[],bookings:[],estimates:[],invoices:[],followups:[],messages:[],inventory:[],members:[],resources:[]};function ses(){try{return JSON.parse(localStorage.getItem(S)||'null')}catch{return null}}function save(x){x?localStorage.setItem(S,JSON.stringify(x)):localStorage.removeItem(S)}function toast(x){let t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}async function req(path,opt={}){let ss=ses(),h={'apikey':K,...opt.headers};if(ss?.access_token)h.Authorization='Bearer '+ss.access_token;let r=await fetch(U+path,{...opt,headers:h}),tx=await r.text(),d;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||r.statusText);return d}async function rpc(n,a={},pub=false){let ss=ses(),h={'apikey':K,'Content-Type':'application/json'};if(!pub&&ss?.access_token)h.Authorization='Bearer '+ss.access_token;let r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:h,body:JSON.stringify(a)}),tx=await r.text(),d;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw Error(d?.message||d?.hint||r.statusText);return d}async function sel(t,q=''){return req('/rest/v1/'+t+(q?'?'+q:''))}async function ins(t,x){return req('/rest/v1/'+t,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(x)})}function landing(){root.innerHTML=`<header class=nav><div class=brand><b>T</b>Töökoja</div><nav class=navlinks><a href=#toode>Toode</a><a href=#hinnad>Hinnad</a><a href=#turvalisus>Turvalisus</a></nav><div><button class=btn onclick="auth()">Logi sisse</button> <button class="btn p" onclick="auth('signup')">Alusta pilooti</button></div></header><main><section class=hero><div><div class=ey>AUTOTÖÖKOJA JUHTIMINE</div><h1>Töö ära tehtud. Raha ei jää lauale.</h1><p>Töökaardid, kalender, digikontroll, pakkumised, kliendikinnitus, arved ja järeltegevused ühes loogilises Eesti töökoja töövoos.</p><div class=actions><button class="btn p" onclick="auth('signup')">Alusta 30 päeva tasuta</button></div></div><div class=preview><div class=metricgrid><div class=metric><span>Tänased tööd</span><b>7</b></div><div class=metric><span>Ootab klienti</span><b>845 €</b></div><div class=metric><span>Täituvus</span><b>86%</b></div></div><div class=row><span><b>236MCP</b><br><small class=muted>Audi A4 · hooldus</small></span><span class=pill>Töös</span></div><div class=row><span><b>825TRR</b><br><small class=muted>Mercedes GLK · esipidurid</small></span><b>310 €</b></div></div></section><section id=toode class=section style="background:#fff"><div class=wrap><div class=ey>TÖÖVOOG</div><h2>Üks süsteem algusest lõpuni</h2><div class=grid3><div class=card><h3>Broneering ja kalender</h3><p class=muted>Klient, auto, aeg, tehnik ja tööplaan.</p></div><div class=card><h3>Töökaart + kontroll</h3><p class=muted>Tehniku mobiilne töövoog, kontroll ja fotod.</p></div><div class=card><h3>Pakkumine + järeltegevus</h3><p class=muted>Leitud töö ei kao ära isegi siis, kui klient valib “Teen hiljem”.</p></div></div></div></section><section id=hinnad class=section><div class=wrap><div class=grid3><div class=card><h3>Core</h3><div class=price>79 €</div></div><div class=card><h3>Growth</h3><div class=price>149 €</div></div><div class=card><h3>Pro</h3><div class=price>249 €</div></div></div></div></section></main>`}function auth(mode='signin'){root.innerHTML=`<div class=auth><div class=authbox><div class=brand><b>T</b>Töökoja</div><h1>${mode==='signup'?'Loo konto':'Logi sisse'}</h1><div class=field><label>E-post</label><input id=em type=email></div><div class=field style="margin-top:9px"><label>Parool</label><input id=pw type=password></div>${mode==='signup'?'<div class=field style="margin-top:9px"><label>Nimi</label><input id=nm></div>':''}<button class="btn p" style="width:100%;margin-top:14px" onclick="doAuth('${mode}')">${mode==='signup'?'Loo konto':'Logi sisse'}</button><p><a href="#" onclick="landing()">← Avalehele</a></p></div></div>`}async function doAuth(mode){try{let e=$('#em').value.trim(),p=$('#pw').value,r,d;if(mode==='signup'){r=await fetch(U+'/auth/v1/signup',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,data:{full_name:$('#nm').value.trim()}})});d=await r.json();if(!r.ok)throw Error(d.msg||d.message);if(d.access_token)save(d);await boot()}else{r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});d=await r.json();if(!r.ok)throw Error(d.error_description||d.message);save(d);await boot()}}catch(e){toast(e.message)}}async function boot(){try{let ss=ses();if(!ss?.access_token)return auth();let u=await req('/auth/v1/user');st.user=u;let m=await sel('organization_memberships','select=*&user_id=eq.'+u.id+'&active=eq.true&limit=1');if(!m.length)return setup();st.member=m[0];st.org=(await sel('organizations','select=*&id=eq.'+m[0].organization_id))[0];await loadAll();renderApp()}catch(e){toast(e.message);save(null);auth()}}function setup(){root.innerHTML=`<div class=auth><div class=authbox><h1>Loo oma töökoda</h1><div class=field><label>Töökoja nimi</label><input id=wn></div><button class="btn p" style="width:100%;margin-top:12px" onclick="createWorkshop()">Loo töökoda</button></div></div>`}async function createWorkshop(){try{await rpc('create_workshop',{_name:$('#wn').value,_plan:'growth'});await boot()}catch(e){toast(e.message)}}async function loadAll(){let q='organization_id=eq.'+st.org.id;[st.customers,st.vehicles,st.jobs,st.bookings,st.estimates,st.invoices,st.followups,st.messages,st.inventory]=await Promise.all([sel('customers','select=*&'+q+'&order=name'),sel('vehicles','select=*&'+q+'&order=reg_nr'),sel('work_orders','select=*&'+q+'&order=created_at.desc&limit=500'),sel('bookings','select=*&'+q+'&order=created_at.desc&limit=100'),sel('estimates','select=*&'+q+'&order=created_at.desc&limit=100'),sel('invoices','select=*&'+q+'&order=created_at.desc&limit=100'),sel('followups','select=*&'+q+'&order=due_date&limit=200'),sel('messages','select=*&'+q+'&order=created_at.desc&limit=200'),sel('inventory_items','select=*&'+q+'&order=name&limit=500')])}const labels={today:'Täna',jobs:'Tööd',customers:'Kliendid',quotes:'Pakkumised',invoices:'Arved',follow:'Järeltegevused',sms:'SMS',inventory:'Ladu',results:'Tulemus',settings:'Seaded'};function renderApp(){root.innerHTML=`<div class=app><aside class=side><div class=brand><b>T</b>Töökoja</div>${Object.entries(labels).map(([k,v])=>`<button class="${st.view===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}<button onclick="logout()">Logi välja</button></aside><main class=main><header class=top><b>${esc(st.org.name)}</b><span class=muted>${st.member.role}</span></header><div id=content class=content></div><nav class=bottom>${['today','jobs','customers','sms','settings'].map(k=>`<button class="${st.view===k?'on':''}" onclick="go('${k}')">${labels[k]}</button>`).join('')}</nav></main></div>`;draw()}function go(v){st.view=v;renderApp()}function h(t,s='',a=''){return `<div class=pagehead><div><h1>${t}</h1><div class=muted>${s}</div></div><div>${a}</div></div>`}function cust(id){return st.customers.find(x=>x.id===id)}function veh(id){return st.vehicles.find(x=>x.id===id)}function jt(j){let v=veh(j.vehicle_id);return `${v?.reg_nr||'—'} · ${j.title||j.complaint||'Töö'}`}function tbl(hs,rs){return `<div class="panel tablewrap"><table><thead><tr>${hs.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table>${rs.length?'':'<div class=empty>Andmeid pole.</div>'}</div>`}function draw(){let c=$('#content');if(st.view==='today'){let td=new Date().toISOString().slice(0,10),js=st.jobs.filter(j=>j.scheduled_at?.slice(0,10)===td),rq=st.bookings.filter(b=>b.status==='REQUESTED');c.innerHTML=h('Täna','Tänane töökoja seis')+`<div class=kpis><div class=kpi><span>Töid täna</span><b>${js.length}</b></div><div class=kpi><span>Uued päringud</span><b>${rq.length}</b></div><div class=kpi><span>Avatud pakkumised</span><b>${eur(st.estimates.filter(e=>e.status==='sent').reduce((a,x)=>a+(+x.total_gross||0),0))}</b></div><div class=kpi><span>Järeltegevusi</span><b>${st.followups.filter(x=>x.status==='open').length}</b></div></div><div class=panel><div class=pb>${js.map(j=>`<div class=row><span><b>${time(j.scheduled_at)}</b> ${esc(jt(j))}</span><span class=pill>${j.status}</span></div>`).join('')||'<div class=empty>Töid pole.</div>'}</div></div>`}else if(st.view==='jobs')c.innerHTML=h('Tööd')+tbl(['Nr','Auto','Klient','Staatus','Summa'],st.jobs.map(j=>['#'+j.number,jt(j),cust(j.customer_id)?.name||'',`<span class=pill>${j.status}</span>`,eur(j.total_gross)]));else if(st.view==='customers')c.innerHTML=h('Kliendid')+tbl(['Klient','Telefon','Autod'],st.customers.map(x=>[x.name,x.phone||'',st.vehicles.filter(v=>v.customer_id===x.id).map(v=>v.reg_nr).join(', ')]));else if(st.view==='quotes')c.innerHTML=h('Pakkumised')+tbl(['Staatus','Töö','Kokku'],st.estimates.map(e=>[e.status,jt(st.jobs.find(j=>j.id===e.work_order_id)||{}),eur(e.total_gross)]));else if(st.view==='invoices')c.innerHTML=h('Arved')+tbl(['Arve','Staatus','Kokku','Laekunud'],st.invoices.map(i=>[i.invoice_number,i.status,eur(i.total_gross),eur(i.paid_total)]));else if(st.view==='follow')c.innerHTML=h('Järeltegevused')+tbl(['Tähtaeg','Tüüp','Väärtus','Staatus'],st.followups.map(f=>[date(f.due_date),f.kind,eur(f.value),f.status]));else if(st.view==='sms')c.innerHTML=h('SMS','Meeldetuletuste järjekord',`<button class="btn p" onclick="genSms()">Loo meeldetuletused</button>`)+`<div class=attention><b>${st.messages.filter(x=>x.channel==='sms'&&x.status==='queued').length} SMS-i järjekorras</b><br><span class=muted>Päris saatmine vajab SMS-teenusepakkuja ühendust.</span></div>`+tbl(['Staatus','Saaja','Sõnum'],st.messages.filter(x=>x.channel==='sms').map(m=>[m.status,m.recipient||'',esc(m.body)]));else if(st.view==='inventory')c.innerHTML=h('Ladu')+tbl(['SKU','Nimi','Laoseis','Hind'],st.inventory.map(i=>[i.sku,i.name,i.quantity,eur(i.sale_price)]));else if(st.view==='results')c.innerHTML=h('Tulemus')+`<div class=kpis><div class=kpi><span>Arveldatud</span><b>${eur(st.invoices.reduce((a,x)=>a+(+x.total_gross||0),0))}</b></div><div class=kpi><span>Makstud</span><b>${eur(st.invoices.reduce((a,x)=>a+(+x.paid_total||0),0))}</b></div></div>`;else c.innerHTML=h('Seaded')+`<div class=grid3><div class=card><h3>${esc(st.org.name)}</h3><p>Tunnihind ${eur(st.org.hourly_rate)}</p></div><div class=card><h3>Transpordiamet</h3><span class="pill amber">Ühendamata</span></div><div class=card><h3>SMS</h3><span class="pill amber">Ühendamata</span></div></div>`}async function genSms(){try{let r=await rpc('generate_sms_reminders',{_org:st.org.id});toast('Loodi '+(r.created||0)+' SMS-i');await loadAll();renderApp()}catch(e){toast(e.message)}}async function logout(){save(null);landing()}let root=document.getElementById('root');ses()?.access_token?boot():landing();
</script></body></html>
